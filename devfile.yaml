schemaVersion: 2.3.0
metadata:
  name: composite-commands
components:
  - name: tools
    container:
      image: registry.access.redhat.com/ubi9/nodejs-20:9.5-1733148170
      args: ['tail', '-f', '/dev/null']
      endpoints:
        - exposure: public
          name: nodejs
          protocol: https
          targetPort: 3000
      memoryLimit: 2Gi
      memoryRequest: 256Mi
      mountSources: true
    attributes:
      controller.devfile.io/merge-contribution: true

commands:
  - id: install-dependencies
    exec:
      label: "Install dependencies"
      component: tools
      workingDir: ${PROJECT_SOURCE}/app
      commandLine: "npm install"
      group:
        kind: build
        isDefault: true

  - id: run-application
    exec:
      label: "Run web application"
      component: tools
      workingDir: ${PROJECT_SOURCE}/app
      commandLine: "nodemon app.js"
      group:
        kind: run

  - id: debug
    exec:
      label: "Run web application (debugging enabled)"
      component: tools
      workingDir: ${PROJECT_SOURCE}/app
      commandLine: "nodemon --inspect app.js"
      group:
        kind: debug
        isDefault: true

  - id: stop-application
    exec:
      label: "Stop web application"
      component: tools
      commandLine: >-
          node_server_pids=$(pgrep -fx '.*nodemon (--inspect )?app.js' | tr "\\n" " ") &&
          echo "Stopping node server with PIDs: ${node_server_pids}" && 
          kill -15 ${node_server_pids} &>/dev/null && echo 'Done.'
      group:
        kind: run
  - id: node-version
    exec:
      label: "Check Node.js version"
      component: tools
      commandLine: "node -v"
  - id: npm-version
    exec:
      label: "Check npm version"
      component: tools
      commandLine: "npm -v"
  - id: npm-version-node-version
    composite:
      label: "Sequential: Check versions"
      commands:
        - npm-version
        - node-version
      parallel: false
  - id: check-versions-install-deps
    composite:
      label: "Check versions => Install deps"
      commands:
        - npm-version-node-version
        - install-dependencies
      parallel: false
  - id: parallel-check-versions
    composite:
      label: "Parallel: Check versions"
      commands:
        - npm-version
        - node-version
      parallel: true
  - id: install-deps-and-run-app
    composite:
      label: "Install deps => Run web app"
      commands:
        - install-dependencies
        - run-application
      parallel: false
  - id: parallel-install-deps-and-run-app
    composite:
      label: "Parallel: Install deps and Run web app"
      commands:
        - install-dependencies
        - run-application
      parallel: true
  - id: check-node-and-install-deps-and-run-app
    composite:
      label: "Check Node.js version => Install deps => Run web app"
      commands:
        - node-version
        - install-dependencies
        - run-application
      parallel: false
  - id: check-versions-install-deps-run-app
    composite:
      label: "Check versions => Install deps => Run web app"
      commands:
        - check-versions-install-deps
        - run-application
      parallel: false
